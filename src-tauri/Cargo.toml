[package]
name = "passsa"
version = "0.1.0"
description = "PassSa password manager"
authors = ["PassSa"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "passsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
