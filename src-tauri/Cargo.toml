[package]
name = "passsa"
version = "0.2.0"
description = "PassSa local-first password manager for desktop"
authors = ["PassSa"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "passsa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.0"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
