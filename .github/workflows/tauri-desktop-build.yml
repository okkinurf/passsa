name: Tauri v2 desktop builds

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/prepare-tauri-runtime.js"
      - "scripts/tauri-*.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tauri-desktop-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-unsigned:
    if: github.ref != 'refs/heads/main'
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run unit and regression tests
        run: npm test

      - name: Audit Tauri runtime and release package configuration
        run: npm run qa:tauri

      - name: Build unsigned Windows installer for review
        shell: pwsh
        run: |
          npm run tauri:build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Build installer Windows Tauri gagal.' }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PassSa-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  windows-signed:
    if: github.ref == 'refs/heads/main'
    name: Windows installer (NSIS)
    runs-on: windows-latest
    environment:
      name: windows-signing
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run unit and regression tests
        run: npm test

      - name: Audit Tauri runtime and release package configuration
        run: npm run qa:tauri

      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $required = @('WINDOWS_CERTIFICATE_BASE64', 'WINDOWS_CERTIFICATE_PASSWORD', 'WINDOWS_CERTIFICATE_SUBJECT', 'WINDOWS_CERTIFICATE_THUMBPRINT')
          if ($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }) {
            throw 'Konfigurasi signing Windows belum lengkap pada environment windows-signing.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'passsa-tauri-signing.pfx'
          $keepCertificate = $false
          $imported = @()
          try {
            try { $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64) }
            catch { throw 'WINDOWS_CERTIFICATE_BASE64 bukan Base64 PFX yang valid.' }
            [IO.File]::WriteAllBytes($certificatePath, $bytes)
            $bytes = $null
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $thumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            $certificate = @($imported | Where-Object { $_.Thumbprint -eq $thumbprint } | Select-Object -First 1)
            if (!$certificate) { throw 'Thumbprint sertifikat hasil import tidak cocok.' }
            if ($certificate[0].Subject -ne $env:WINDOWS_CERTIFICATE_SUBJECT.Trim()) { throw 'Subject sertifikat hasil import tidak cocok.' }
            if (!$certificate[0].HasPrivateKey) { throw 'Sertifikat tidak memiliki private key signing.' }
            "TAURI_CERTIFICATE_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $keepCertificate = $true
            Write-Output 'Sertifikat signing Windows lolos pemeriksaan.'
          } finally {
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
            if (!$keepCertificate) {
              foreach ($candidate in $imported) {
                Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $candidate.Thumbprint } | Remove-Item -Force
              }
            }
          }

      - name: Build signed Windows installer
        shell: pwsh
        run: |
          $signingConfigPath = Join-Path $env:RUNNER_TEMP 'passsa-tauri-signing.json'
          try {
            $signingConfig = @{ bundle = @{ windows = @{ certificateThumbprint = $env:TAURI_CERTIFICATE_THUMBPRINT; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com'; tsp = $true } } } | ConvertTo-Json -Compress -Depth 5
            Set-Content -LiteralPath $signingConfigPath -Value $signingConfig -Encoding utf8
            npm run tauri:build -- --bundles nsis --config $signingConfigPath
            if ($LASTEXITCODE -ne 0) { throw 'Build installer Windows Tauri gagal.' }
          } finally {
            if (Test-Path -LiteralPath $signingConfigPath) { Remove-Item -LiteralPath $signingConfigPath -Force }
          }

      - name: Verify Windows installer signature
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT }}
        run: |
          $thumbprint = ($env:TAURI_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Versi paket tidak dapat dibaca untuk memeriksa artifact.' }
          $installer = "src-tauri/target/release/bundle/nsis/PassSa_${version}_x64-setup.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Installer Windows tidak ditemukan: $installer." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signer = $signature.SignerCertificate
          $actualThumbprint = if ($signer) { ($signer.Thumbprint -replace '\s', '').ToUpperInvariant() } else { '<tidak ditemukan>' }
          $expectedSubject = $env:WINDOWS_CERTIFICATE_SUBJECT.Trim()
          $knownUntrustedRoot = $signature.Status -in @('NotTrusted', 'UnknownError') -and $signature.StatusMessage -match '(?i)(certificate chain.*(?:not trusted|untrusted|could not be built)|root certificate.*not trusted)'
          $signatureIntegrityValid = $signature.Status -eq 'Valid' -or $knownUntrustedRoot
          if (!$signer -or $actualThumbprint -ne $thumbprint -or $signer.Subject -ne $expectedSubject -or !$signatureIntegrityValid) {
            throw "Signature installer tidak cocok (status=$($signature.Status); subject=$($signer.Subject); thumbprint=$actualThumbprint)."
          }
          Write-Output 'Signature Authenticode installer cocok dengan sertifikat PassSa dan integritas file terverifikasi.'

      - name: Upload signed Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PassSa-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove Windows signing certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:TAURI_CERTIFICATE_THUMBPRINT
          if (![string]::IsNullOrWhiteSpace($thumbprint)) {
            $thumbprint = ($thumbprint -replace '\s', '').ToUpperInvariant()
            Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumbprint } | Remove-Item -Force
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'passsa-tauri-signing.pfx'
          if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }

  macos:
    name: macOS disk image (DMG)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run unit and regression tests
        run: npm test

      - name: Audit Tauri runtime and release package configuration
        run: npm run qa:tauri

      - name: Build macOS disk image
        run: npm run tauri:build -- --bundles dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PassSa-macos-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages (AppImage + deb)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install Linux Tauri prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl file git libayatana-appindicator3-dev \
            libdbus-1-dev libgtk-3-dev libsecret-1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf pkg-config \
            tar wget

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run unit and regression tests
        run: npm test

      - name: Audit Tauri runtime and release package configuration
        run: npm run qa:tauri

      - name: Build Linux packages on the Ubuntu 22.04 ABI baseline
        run: npm run tauri:build -- --bundles appimage,deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PassSa-linux-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
