name: Publish signed Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag and package version to build and release, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: passsa-windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release and signing configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Tag harus menggunakan format vMAJOR.MINOR.PATCH.' }
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG tidak cocok dengan package version $version." }
          if (!(Test-Path -LiteralPath 'scripts/release-package-audit.js')) { throw 'Tag belum memiliki audit paket release terbaru. Buat tag dari commit release-hardening terkini.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Signing belum disiapkan. Tambahkan repository secrets WINDOWS_CERTIFICATE_BASE64 dan WINDOWS_CERTIFICATE_PASSWORD.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_SUBJECT)) {
            throw 'Tambahkan repository variable WINDOWS_CERTIFICATE_SUBJECT dengan Subject sertifikat publisher yang diharapkan.'
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit, E2E, and performance QA
        run: npm run qa

      - name: Rebuild Windows Hello helper from source
        shell: pwsh
        run: ./scripts/build-windows-hello-helper.ps1

      - name: Prepare temporary signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'passsa-release-signing.pfx'
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw 'WINDOWS_CERTIFICATE_BASE64 bukan Base64 PFX yang valid.'
          }
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed NSIS installer
        run: npm run dist
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Audit packaged files and verify signatures
        run: npm run qa:installer
        env:
          PASSA_EXPECTED_SIGNER_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT }}

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installerName = "PassSa-Setup-$version.exe"
          $installer = Join-Path 'dist' $installerName
          if (!(Test-Path -LiteralPath $installer)) { throw "Installer tidak ditemukan: $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Attach installer and checksum to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @"
          PassSa $env:RELEASE_TAG — Development Preview

          Signed Windows installer and SHA256SUMS.txt checksum are attached to this release.

          This is a development prerelease, not a stable release. PassSa has not had an independent security audit; avoid using it for critical production credentials.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'passsa-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $releaseNotes -Encoding utf8
          $version = node -p "require('./package.json').version"
          $installer = Join-Path 'dist' "PassSa-Setup-$version.exe"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $installer 'dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Gagal mengunggah installer dan checksum ke GitHub release.' }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "PassSa $env:RELEASE_TAG — Development Preview" --notes-file $notesPath --prerelease --draft=false
          } else {
            gh release create $env:RELEASE_TAG $installer 'dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --title "PassSa $env:RELEASE_TAG — Development Preview" --notes-file $notesPath --prerelease --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Gagal memublikasikan release Windows PassSa.' }

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'passsa-release-signing.pfx'
          if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
